<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Scout Camp">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <title>Scout Camp</title>
  <script>
    (function(){var h=new Date().getHours();document.documentElement.dataset.theme=(h>=20||h<7)?'dark':'light';})();
  </script>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F2F2F7;
      --card: #FFFFFF;
      --text: #1C1C1E;
      --text2: #6C6C70;
      --text3: #AEAEB2;
      --border: rgba(0,0,0,0.08);
      --blue: #007AFF;
      --green: #34C759;
      --orange: #FF9500;
      --red: #FF3B30;
      --camp: #2E7D32;
      --radius: 12px;
      --header-h: 88px;
      --tab-h: 49px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1C1C1E; --card: #2C2C2E; --text: #FFFFFF;
        --text2: #AEAEB2; --text3: #636366; --border: rgba(255,255,255,0.1);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Header ─────────────────────────────── */
    .header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(242,242,247,0.85);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 0.5px solid var(--border);
      padding: calc(env(safe-area-inset-top) + 14px) 16px 12px;
    }
    @media (prefers-color-scheme: dark) { .header { background: rgba(28,28,30,0.85); } }
    .header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .header h1 { font-size: 17px; font-weight: 600; color: var(--text); }
    .sync-area { display: flex; align-items: center; gap: 6px; }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; transition: background 0.4s; }
    #syncLabel { font-size: 12px; color: var(--text2); }
    .refresh-btn { background: none; border: none; cursor: pointer; padding: 4px; color: var(--text2); font-size: 16px; line-height: 1; }

    /* ── Status dot colours ──────────────────── */
    .dot-green  { background: var(--green); }
    .dot-orange { background: var(--orange); }
    .dot-red    { background: var(--red); }
    .dot-blue   { background: var(--blue); }

    /* ── Tab bar ─────────────────────────────── */
    .tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: rgba(242,242,247,0.9);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 0.5px solid var(--border);
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
    }
    @media (prefers-color-scheme: dark) { .tab-bar { background: rgba(28,28,30,0.9); } }
    .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 0 6px; cursor: pointer; user-select: none; }
    .tab-icon  { font-size: 22px; line-height: 1; margin-bottom: 2px; }
    .tab-label { font-size: 10px; font-weight: 500; color: var(--text3); }
    .tab-item.active .tab-label { color: var(--camp); }

    /* ── Content ─────────────────────────────── */
    .content {
      padding-top: var(--header-h);
      padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px);
    }
    .screen { display: none; padding: 14px 14px 0; }
    .screen.active { display: block; }

    /* ── Stat grid ──────────────────────────── */
    .stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 4px; }
    .stat-card { background: var(--card); border-radius: var(--radius); padding: 14px 16px; }
    .stat-num { font-size: 30px; font-weight: 700; line-height: 1; color: var(--text); }
    .stat-num.warn  { color: var(--orange); }
    .stat-num.alert { color: var(--red); }
    .stat-num.good  { color: var(--green); }
    .stat-label { font-size: 12px; color: var(--text2); margin-top: 4px; }

    /* ── Section title ───────────────────────── */
    .section-title {
      font-size: 12px; font-weight: 600; color: var(--text2);
      text-transform: uppercase; letter-spacing: 0.05em;
      margin: 22px 2px 8px;
    }

    /* ── Person cards ────────────────────────── */
    .person-card { background: var(--card); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px; }
    .person-card-header { display: flex; align-items: center; gap: 12px; }
    .person-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      font-size: 17px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .av-mia    { background: rgba(0,122,255,0.12); color: var(--blue); }
    .av-ava    { background: rgba(52,199,89,0.12);  color: #1A8F3C; }
    .av-shared { background: rgba(110,110,115,0.12); color: var(--text2); }
    .person-stat { flex: 1; min-width: 0; }
    .person-name { font-size: 15px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .pct-pill {
      font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px;
      background: rgba(0,0,0,0.06); color: var(--text2);
    }
    .person-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .bar-bg { background: var(--bg); border-radius: 4px; height: 6px; overflow: hidden; margin-top: 10px; }
    .bar-fill { height: 6px; border-radius: 4px; transition: width 0.4s; }
    .bar-green  { background: var(--green); }
    .bar-orange { background: var(--orange); }
    .bar-red    { background: var(--red); }

    /* ── Badges ──────────────────────────────── */
    .badge { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
    .b-green  { background: rgba(52,199,89,0.14);   color: #1A7F37; }
    .b-blue   { background: rgba(0,122,255,0.12);   color: #0065D0; }
    .b-orange { background: rgba(255,149,0,0.14);   color: #A05A00; }
    .b-red    { background: rgba(255,59,48,0.12);   color: #C0001A; }
    .b-gray   { background: rgba(110,110,115,0.12); color: var(--text2); }
    .b-purple { background: rgba(175,82,222,0.12);  color: #7A3080; }

    @media (prefers-color-scheme: dark) {
      .b-green  { color: #30D158; } .b-blue  { color: #409CFF; } .b-orange { color: #FF9500; }
      .b-red    { color: #FF453A; } .b-purple { color: #DA8FFE; }
      .av-ava   { color: var(--green); }
      .pct-pill { background: rgba(255,255,255,0.1); }
    }

    /* ── Item cards ──────────────────────────── */
    .item-card {
      background: var(--card); border-radius: var(--radius);
      padding: 12px 14px; margin-bottom: 8px;
      display: flex; align-items: center; gap: 12px;
      cursor: pointer; transition: opacity 0.12s;
    }
    .item-card:active { opacity: 0.65; }
    .item-card.critical { border-left: 3px solid var(--red); border-radius: 0 var(--radius) var(--radius) 0; }
    .status-btn {
      width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
      border: none; cursor: pointer; transition: transform 0.12s;
    }
    .status-btn:active { transform: scale(0.78); }
    .item-info { flex: 1; min-width: 0; }
    .item-name { font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-meta { font-size: 12px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }

    /* ── Filter pills ────────────────────────── */
    .filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; -webkit-overflow-scrolling: touch; scrollbar-width: none; margin-bottom: 2px; }
    .filter-row::-webkit-scrollbar { display: none; }
    .pill { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; background: var(--card); color: var(--text2); border: 0.5px solid var(--border); user-select: none; }
    .pill.active { background: var(--camp); color: #fff; border-color: var(--camp); }

    /* ── Alert banner ────────────────────────── */
    .alert-banner {
      background: rgba(255,59,48,0.08); border: 0.5px solid rgba(255,59,48,0.25);
      border-radius: var(--radius); padding: 10px 14px; font-size: 13px; color: var(--red);
      margin-bottom: 8px; cursor: pointer; transition: opacity 0.12s;
    }
    .alert-banner:active { opacity: 0.7; }

    /* ── Loading / empty ─────────────────────── */
    .loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 240px; gap: 14px; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--camp); border-radius: 50%; animation: spin 0.75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: var(--text2); }
    .empty-state { text-align: center; padding: 48px 20px; }
    .empty-icon  { font-size: 44px; margin-bottom: 12px; }
    .empty-title { font-size: 16px; font-weight: 500; margin-bottom: 6px; }
    .empty-sub   { font-size: 14px; color: var(--text2); line-height: 1.5; }

    /* ── Qty stepper ─────────────────────────── */
    .qty-row { display: flex; align-items: center; gap: 4px; }
    .qty-btn { width: 34px; height: 34px; border-radius: 8px; border: 0.5px solid var(--border); background: var(--card); color: var(--text); font-size: 20px; font-weight: 300; cursor: pointer; line-height: 1; display: flex; align-items: center; justify-content: center; -webkit-user-select: none; user-select: none; }
    .qty-val { min-width: 32px; text-align: center; font-size: 17px; font-weight: 600; color: var(--text); }

    /* ── Bottom sheet ────────────────────────── */
    .sheet-overlay { position: fixed; inset: 0; z-index: 200; display: none; }
    .sheet-overlay.open { display: block; }
    .sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.45); }
    .sheet-panel { position: absolute; bottom: 0; left: 0; right: 0; background: var(--card); border-radius: 18px 18px 0 0; padding: 12px 20px calc(env(safe-area-inset-bottom) + 24px); }
    @media (min-width: 600px) { .sheet-panel { max-width: 520px; left: 50%; transform: translateX(-50%); } }
    .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
    .sheet-title  { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 20px; }
    .sheet-field  { margin-bottom: 16px; }
    .sheet-label  { font-size: 12px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .sheet-select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 0.5px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; font-family: inherit; -webkit-appearance: none; appearance: none; }
    .sheet-note   { font-size: 13px; color: var(--text2); line-height: 1.6; }
    .btn-save     { width: 100%; padding: 14px; background: var(--camp); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 4px; }

    /* ── Time-of-day overrides ───────────────── */
    html[data-theme="dark"] { --bg:#1C1C1E; --card:#2C2C2E; --text:#FFFFFF; --text2:#AEAEB2; --text3:#636366; --border:rgba(255,255,255,0.1); }
    html[data-theme="light"]{ --bg:#F2F2F7; --card:#FFFFFF;  --text:#1C1C1E; --text2:#6C6C70; --text3:#AEAEB2; --border:rgba(0,0,0,0.08); }
    html[data-theme="dark"]  .header  { background: rgba(28,28,30,0.85); }
    html[data-theme="light"] .header  { background: rgba(242,242,247,0.85); }
    html[data-theme="dark"]  .tab-bar { background: rgba(28,28,30,0.9); }
    html[data-theme="light"] .tab-bar { background: rgba(242,242,247,0.9); }
    html[data-theme="dark"]  .b-green  { color:#30D158; } html[data-theme="light"] .b-green  { color:#1A7F37; }
    html[data-theme="dark"]  .b-blue   { color:#409CFF; } html[data-theme="light"] .b-blue   { color:#0065D0; }
    html[data-theme="dark"]  .b-orange { color:#FF9500; } html[data-theme="light"] .b-orange { color:#A05A00; }
    html[data-theme="dark"]  .b-red    { color:#FF453A; } html[data-theme="light"] .b-red    { color:#C0001A; }
    html[data-theme="dark"]  .b-purple { color:#DA8FFE; } html[data-theme="light"] .b-purple { color:#7A3080; }
    html[data-theme="dark"]  .av-ava   { color:var(--green); }
    html[data-theme="light"] .av-ava   { color:#1A8F3C; }
    html[data-theme="dark"]  .pct-pill { background:rgba(255,255,255,0.1); }
    html[data-theme="light"] .pct-pill { background:rgba(0,0,0,0.06); }

    /* ── Camera & photos ────────────────────────── */
    .cam-btn {
      background: none; border: none; cursor: pointer; font-size: 17px;
      line-height: 1; padding: 2px; color: var(--text3); margin-top: 4px; flex-shrink: 0;
    }
    .item-thumb {
      width: 32px; height: 32px; border-radius: 6px; object-fit: cover;
      cursor: pointer; margin-top: 4px; flex-shrink: 0; display: block;
    }
    .sheet-photo-area { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .sheet-photo-prev { width: 80px; height: 80px; border-radius: 10px; object-fit: cover; cursor: pointer; }
    .sheet-cam-btn {
      padding: 8px 16px; border-radius: 10px; border: 0.5px solid var(--border);
      background: var(--bg); color: var(--camp); font-size: 14px; font-weight: 500;
      cursor: pointer; font-family: inherit;
    }
    .sheet-cam-del {
      padding: 8px 16px; border-radius: 10px; border: 0.5px solid var(--border);
      background: var(--bg); color: var(--red); font-size: 14px; font-weight: 500;
      cursor: pointer; font-family: inherit;
    }
    .photo-modal {
      position: fixed; inset: 0; z-index: 400; background: rgba(0,0,0,0.92);
      align-items: center; justify-content: center; display: none; padding: 16px;
    }
    .photo-modal.open { display: flex; }
    .photo-modal-img { max-width: 100%; max-height: 90dvh; object-fit: contain; border-radius: 8px; }
    .photo-modal-close {
      position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 16px;
      background: rgba(60,60,60,0.85); border: none; color: #fff; font-size: 18px;
      width: 36px; height: 36px; border-radius: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Desktop tweaks ──────────────────────── */
    @media (min-width: 600px) {
      .content { max-width: 520px; margin: 0 auto; }
      .tab-bar { max-width: 520px; left: 50%; transform: translateX(-50%); border-left: 0.5px solid var(--border); border-right: 0.5px solid var(--border); }
      .header  { max-width: 520px; left: 50%; transform: translateX(-50%); border-left: 0.5px solid var(--border); border-right: 0.5px solid var(--border); }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <h1>🏕️ Scout Camp</h1>
    <div class="sync-area">
      <div class="sync-dot dot-orange" id="syncDot"></div>
      <span id="syncLabel">Loading…</span>
      <button class="refresh-btn" onclick="loadData()" title="Refresh">↻</button>
    </div>
  </div>
</div>

<div class="content">
  <div id="screen-overview" class="screen active">
    <div class="loading-wrap">
      <div class="spinner"></div>
      <div class="loading-text">Loading camp data…</div>
    </div>
  </div>
  <div id="screen-packing" class="screen"></div>
  <div id="screen-menu"    class="screen"></div>
  <div id="screen-gear"    class="screen"></div>
</div>

<div class="tab-bar">
  <div class="tab-item active" id="tab-overview" onclick="switchTab('overview')">
    <div class="tab-icon">📊</div>
    <div class="tab-label">Overview</div>
  </div>
  <div class="tab-item" id="tab-packing" onclick="switchTab('packing')">
    <div class="tab-icon">🎒</div>
    <div class="tab-label">Packing</div>
  </div>
  <div class="tab-item" id="tab-menu" onclick="switchTab('menu')">
    <div class="tab-icon">🍽️</div>
    <div class="tab-label">Menu</div>
  </div>
  <div class="tab-item" id="tab-gear" onclick="switchTab('gear')">
    <div class="tab-icon">⛺</div>
    <div class="tab-label">Gear</div>
  </div>
</div>

<div class="photo-modal" id="photoModal" onclick="closePhotoModal()">
  <button class="photo-modal-close" onclick="event.stopPropagation();closePhotoModal()">✕</button>
  <img class="photo-modal-img" id="photoModalImg" src="" alt="Item photo">
</div>
<input type="file" accept="image/*" capture="environment" id="cameraInput" style="display:none">

<div class="sheet-overlay" id="editSheet">
  <div class="sheet-backdrop" onclick="closeSheet()"></div>
  <div class="sheet-panel">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheetTitle"></div>
    <div class="sheet-field">
      <div class="sheet-label">Status</div>
      <select class="sheet-select" id="sheetStatus">
        <option value="Not Started">Not Started</option>
        <option value="Packed">Packed</option>
        <option value="Confirmed">Confirmed</option>
        <option value="Missing">Missing</option>
      </select>
    </div>
    <div class="sheet-field" id="sheetQtyWrap" style="display:none">
      <div class="sheet-label">Qty Packed</div>
      <div class="qty-row">
        <button class="qty-btn" onclick="adjustQty(-1)">−</button>
        <span class="qty-val" id="sheetQtyVal">0</span>
        <button class="qty-btn" onclick="adjustQty(1)">+</button>
        <span id="sheetQtyNeeded" style="font-size:13px;color:var(--text2);margin-left:8px"></span>
      </div>
    </div>
    <div class="sheet-field" id="sheetMetaWrap" style="display:none">
      <div class="sheet-label">Details</div>
      <div class="sheet-note" id="sheetMeta"></div>
    </div>
    <div class="sheet-field" id="sheetNotesWrap" style="display:none">
      <div class="sheet-label">Notes</div>
      <div class="sheet-note" id="sheetNotes"></div>
    </div>
    <div class="sheet-field">
      <div class="sheet-label">Photo</div>
      <div class="sheet-photo-area" id="sheetPhotoArea"></div>
    </div>
    <button class="btn-save" onclick="saveSheet()">Save</button>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────
let items        = [];
let currentTab   = 'overview';
let packPerson   = 'All';
let packCat      = 'All';
let gearCat      = 'All';
let activeDay    = 'Day 1';
let editingId    = null;
let pendingPhotoId   = null;
let photoCache       = {};
let photoCacheLoaded = false;
let _photoDB         = null;

// ── Notion property extractor ─────────────────
function prop(page, name) {
  const p = page.properties?.[name];
  if (!p) return null;
  if (p.type === 'title')     return p.title.map(t => t.plain_text).join('');
  if (p.type === 'rich_text') return p.rich_text.map(t => t.plain_text).join('');
  if (p.type === 'select')    return p.select?.name ?? null;
  if (p.type === 'checkbox')  return p.checkbox ?? false;
  if (p.type === 'number')    return p.number ?? null;
  return null;
}

function parse(page) {
  return {
    id:         page.id,
    name:       prop(page, 'Item Name') || 'Unknown',
    category:   prop(page, 'Category') || '',
    assignedTo: prop(page, 'Assigned To') || 'Shared',
    status:     prop(page, 'Status') || 'Not Started',
    day:        prop(page, 'Day') || '',
    meal:       prop(page, 'Meal') || '',
    weight:     prop(page, 'Weight (g)') ?? 0,
    qtyNeeded:  prop(page, 'Qty Needed') ?? 1,
    qtyPacked:  prop(page, 'Qty Packed') ?? 0,
    notes:      prop(page, 'Notes') || '',
    archived:   prop(page, 'Archived') || false,
  };
}

// ── API ───────────────────────────────────────
async function loadData() {
  setSyncState('loading');
  try {
    const res = await fetch('/api/notion');
    if (!res.ok) throw new Error(res.statusText);
    const pages = await res.json();
    items = pages.map(parse).filter(i => !i.archived);
    if (!photoCacheLoaded) await preloadPhotos();
    setSyncState('ok');
    renderAll();
  } catch(e) {
    setSyncState('err');
    console.error('Load failed:', e);
    document.getElementById('screen-overview').innerHTML = emptyState('📡', "Can't connect", 'Check your connection or Notion config,<br>then tap ↻ to retry.');
  }
}

async function patchItem(id, properties) {
  const res = await fetch('/api/notion', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pageId: id, properties }),
  });
  if (!res.ok) throw new Error('Save failed: ' + res.status);
  return res.json();
}

// ── Photo storage (IndexedDB) ─────────────────
function openPhotoDB() {
  if (_photoDB) return Promise.resolve(_photoDB);
  return new Promise((res, rej) => {
    const req = indexedDB.open('scout-photos', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('photos');
    req.onsuccess = e => { _photoDB = e.target.result; res(_photoDB); };
    req.onerror   = () => rej(req.error);
  });
}
async function photoGet(id) {
  const db = await openPhotoDB();
  return new Promise(r => {
    const req = db.transaction('photos','readonly').objectStore('photos').get(id);
    req.onsuccess = () => r(req.result || null);
    req.onerror   = () => r(null);
  });
}
async function photoPut(id, dataURL) {
  const db = await openPhotoDB();
  return new Promise((res, rej) => {
    const tx = db.transaction('photos','readwrite');
    tx.objectStore('photos').put(dataURL, id);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function photoDel(id) {
  const db = await openPhotoDB();
  return new Promise((res, rej) => {
    const tx = db.transaction('photos','readwrite');
    tx.objectStore('photos').delete(id);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function preloadPhotos() {
  const db = await openPhotoDB();
  return new Promise(res => {
    const cur = db.transaction('photos','readonly').objectStore('photos').openCursor();
    cur.onsuccess = e => {
      const c = e.target.result;
      if (c) { photoCache[c.key] = c.value; c.continue(); }
      else { photoCacheLoaded = true; res(); }
    };
    cur.onerror = res;
  });
}

// ── Camera capture ────────────────────────────
function takePhoto(id) {
  pendingPhotoId = id;
  document.getElementById('cameraInput').click();
}
async function handlePhotoCapture(e) {
  const file = e.target.files[0];
  if (!file || !pendingPhotoId) return;
  const id = pendingPhotoId;
  pendingPhotoId = null;
  e.target.value = '';
  const dataURL = await resizeImage(file, 1200);
  photoCache[id] = dataURL;
  await photoPut(id, dataURL);
  renderAll();
  if (editingId === id) refreshSheetPhoto();
}
function resizeImage(file, maxDim) {
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const s = Math.min(1, maxDim / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    img.src = url;
  });
}
function openPhotoModal(id) {
  const p = photoCache[id]; if (!p) return;
  document.getElementById('photoModalImg').src = p;
  document.getElementById('photoModal').classList.add('open');
}
function closePhotoModal() {
  document.getElementById('photoModal').classList.remove('open');
}
async function removePhoto(id) {
  delete photoCache[id];
  await photoDel(id);
  renderAll();
  if (editingId === id) refreshSheetPhoto();
}
function refreshSheetPhoto() {
  if (!editingId) return;
  const p    = photoCache[editingId];
  const area = document.getElementById('sheetPhotoArea');
  area.innerHTML = p
    ? `<img class="sheet-photo-prev" src="${p}" alt="" onclick="openPhotoModal('${editingId}')"><button class="sheet-cam-btn" onclick="takePhoto('${editingId}')">Retake</button><button class="sheet-cam-del" onclick="removePhoto('${editingId}')">Delete</button>`
    : `<button class="sheet-cam-btn" onclick="takePhoto('${editingId}')">📷 Take photo</button>`;
}

// ── Sync indicator ────────────────────────────
function setSyncState(s) {
  const dot = document.getElementById('syncDot');
  const lbl = document.getElementById('syncLabel');
  dot.className = 'sync-dot ' + (s === 'ok' ? 'dot-green' : s === 'err' ? 'dot-red' : 'dot-orange');
  lbl.textContent = s === 'ok' ? 'Synced' : s === 'err' ? 'Offline' : 'Syncing…';
}

// ── Tab switching ─────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('screen-' + tab).classList.add('active');
  currentTab = tab;
  if (tab === 'packing') renderPacking();
  if (tab === 'menu')    renderMenu();
  if (tab === 'gear')    renderGear();
}

// ── Status helpers ────────────────────────────
const CYCLE = ['Not Started', 'Packed', 'Confirmed'];

function dotClass(s) {
  if (s === 'Confirmed') return 'dot-green';
  if (s === 'Packed')    return 'dot-orange';
  if (s === 'Missing')   return 'dot-red';
  return 'dot-blue';
}

function statusBadge(s) {
  const map = { Confirmed:'b-green', Packed:'b-orange', Missing:'b-red' };
  const cls = map[s] || 'b-red';
  const lbl = s === 'Not Started' ? 'Not packed' : s === 'Missing' ? 'Missing ⚠️' : s;
  return `<span class="badge ${cls}">${lbl}</span>`;
}

function catBadge(c) {
  const map = { Clothing:'b-blue', Food:'b-green', Gear:'b-orange', Safety:'b-red', Activity:'b-purple' };
  return `<span class="badge ${map[c]||'b-gray'}">${c||'—'}</span>`;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Item card ─────────────────────────────────
function itemCard(item) {
  const crit  = item.category === 'Safety' && (item.status === 'Not Started' || item.status === 'Missing');
  const parts = [];
  if (item.weight > 0)     parts.push(item.weight + 'g');
  if (item.qtyNeeded > 1)  parts.push(item.qtyPacked + '/' + item.qtyNeeded + ' packed');
  if (item.day && item.day !== 'All Days') parts.push(item.day);
  const meta = parts.join(' · ');
  return `<div class="item-card${crit?' critical':''}" onclick="openSheetById('${item.id}')">
  <button class="status-btn ${dotClass(item.status)}" onclick="event.stopPropagation();cycleStatus('${item.id}')" title="Tap to change status"></button>
  <div class="item-info">
    <div class="item-name">${esc(item.name)}</div>
    ${meta?`<div class="item-meta">${meta}</div>`:''}
  </div>
  <div class="item-right">${catBadge(item.category)}${statusBadge(item.status)}${photoCache[item.id]?`<img class="item-thumb" src="${photoCache[item.id]}" alt="" onclick="event.stopPropagation();openPhotoModal('${item.id}')">`:`<button class="cam-btn" onclick="event.stopPropagation();takePhoto('${item.id}')" title="Take photo">📷</button>`}</div>
</div>`;
}

// ── Empty / loading helpers ───────────────────
function emptyState(icon, title, sub) {
  return `<div class="empty-state"><div class="empty-icon">${icon}</div><div class="empty-title">${title}</div><div class="empty-sub">${sub}</div></div>`;
}

function section(label, arr) {
  if (!arr.length) return '';
  return `<div class="section-title">${label}</div>` + arr.map(itemCard).join('');
}

// ── Render: Overview ──────────────────────────
function renderOverview() {
  const el = document.getElementById('screen-overview');
  if (!items.length) {
    el.innerHTML = emptyState('📋','No items yet','Add items to the Notion database to get started.');
    return;
  }

  const total   = items.length;
  const doneN   = items.filter(i => i.status==='Packed'||i.status==='Confirmed').length;
  const pct     = Math.round(doneN/total*100);
  const missing = items.filter(i => i.status==='Missing');
  const critical= items.filter(i => i.category==='Safety'&&(i.status==='Not Started'||i.status==='Missing'));

  function pStats(arr) {
    const n = arr.length, done = arr.filter(i=>i.status==='Packed'||i.status==='Confirmed').length;
    const kg = arr.reduce((s,i)=>s+(i.weight||0)*(i.qtyNeeded||1),0);
    return { n, done, p: n?Math.round(done/n*100):0, kg:(kg/1000).toFixed(1) };
  }

  const mS  = pStats(items.filter(i=>i.assignedTo==='Mia'));
  const aS  = pStats(items.filter(i=>i.assignedTo==='Ava'));
  const shS = pStats(items.filter(i=>i.assignedTo==='Shared'));
  const bar = p => p>=100?'bar-green':p>=60?'bar-orange':'bar-red';

  function personCard(initials, label, avCls, st) {
    return `<div class="person-card">
  <div class="person-card-header">
    <div class="person-avatar ${avCls}">${initials}</div>
    <div class="person-stat">
      <div class="person-name">${label} <span class="pct-pill">${st.p}% packed</span></div>
      <div class="person-meta">${st.n} items · ~${st.kg} kg</div>
    </div>
  </div>
  <div class="bar-bg"><div class="bar-fill ${bar(st.p)}" style="width:${st.p}%"></div></div>
</div>`;
  }

  const critBanners = critical.map(i=>`<div class="alert-banner" onclick="openSheetById('${i.id}')">
  <strong>${esc(i.name)}</strong> — ${i.status}
  <div style="font-size:11px;margin-top:3px;opacity:0.75">${i.assignedTo} · ${i.category}</div>
</div>`).join('');

  const otherMissing = missing.filter(i=>i.category!=='Safety').map(i=>`<div class="alert-banner" onclick="openSheetById('${i.id}')">
  <strong>${esc(i.name)}</strong>
  <div style="font-size:11px;margin-top:3px;opacity:0.75">${i.assignedTo} · ${i.category}</div>
</div>`).join('');

  el.innerHTML = `
<div class="stat-grid">
  <div class="stat-card">
    <div class="stat-num ${pct<50?'alert':pct<80?'warn':'good'}">${pct}%</div>
    <div class="stat-label">Overall packed</div>
  </div>
  <div class="stat-card">
    <div class="stat-num">${doneN}<span style="font-size:16px;font-weight:400;color:var(--text2)">/${total}</span></div>
    <div class="stat-label">Items packed</div>
  </div>
  <div class="stat-card">
    <div class="stat-num ${missing.length?'alert':'good'}">${missing.length||'✓'}</div>
    <div class="stat-label">Missing items</div>
  </div>
  <div class="stat-card">
    <div class="stat-num ${critical.length?'alert':'good'}">${critical.length||'✓'}</div>
    <div class="stat-label">Critical unpacked</div>
  </div>
</div>
<div class="section-title">Mia's Pack</div>
${personCard('M','Mia','av-mia',mS)}
<div class="section-title">Ava's Pack</div>
${personCard('A','Ava','av-ava',aS)}
<div class="section-title">Shared Gear</div>
${personCard('⛺','Shared','av-shared',shS)}
${critBanners ? `<div class="section-title" style="color:var(--red)">⚠️ Critical unpacked</div>${critBanners}` : ''}
${otherMissing ? `<div class="section-title">Other missing</div>${otherMissing}` : ''}
<div style="height:8px"></div>`;
}

// ── Render: Packing ───────────────────────────
function renderPacking() {
  const el   = document.getElementById('screen-packing');
  const cats = ['All','Clothing','Gear','Safety','Activity'];
  let pool   = items.filter(i=>i.category!=='Food');
  if (packCat!=='All') pool = pool.filter(i=>i.category===packCat);

  let content;
  if (packPerson==='All') {
    const mia    = pool.filter(i=>i.assignedTo==='Mia');
    const ava    = pool.filter(i=>i.assignedTo==='Ava');
    const shared = pool.filter(i=>i.assignedTo==='Shared');
    content = section('Mia',mia) + section('Ava',ava) + section('Shared',shared) ||
      emptyState('🎒','No items','No items match the current filters.');
  } else {
    const f = pool.filter(i=>i.assignedTo===packPerson);
    content = f.length ? f.map(itemCard).join('') : emptyState('🎒','Nothing here','No items match these filters.');
  }

  el.innerHTML = `
<div class="filter-row">
  ${['All','Mia','Ava','Shared'].map(p=>`<div class="pill${packPerson===p?' active':''}" onclick="setPackPerson('${p}')">${p}</div>`).join('')}
</div>
<div class="filter-row">
  ${cats.map(c=>`<div class="pill${packCat===c?' active':''}" onclick="setPackCat('${c}')">${c}</div>`).join('')}
</div>
${content}
<div style="height:8px"></div>`;
}

// ── Render: Menu ──────────────────────────────
function renderMenu() {
  const el    = document.getElementById('screen-menu');
  const days  = ['Day 1','Day 2','Day 3'];
  const meals = ['Breakfast','Lunch','Dinner','Snack'];
  const dayFood = items.filter(i=>i.category==='Food'&&(i.day===activeDay||i.day==='All Days'));

  const menuContent = meals.map(m=>{
    const arr = dayFood.filter(i=>i.meal===m);
    return arr.length ? `<div class="section-title">${m}</div>` + arr.map(itemCard).join('') : '';
  }).join('') || emptyState('🍽️','No meals planned',`Add Food items for ${activeDay} in Notion.`);

  el.innerHTML = `
<div class="filter-row">
  ${days.map(d=>`<div class="pill${activeDay===d?' active':''}" onclick="setDay('${d}')">${d}</div>`).join('')}
</div>
${menuContent}
<div style="height:8px"></div>`;
}

// ── Render: Gear ──────────────────────────────
function renderGear() {
  const el   = document.getElementById('screen-gear');
  const cats = ['All','Gear','Safety','Activity'];
  let pool   = items.filter(i=>i.assignedTo==='Shared');
  if (gearCat!=='All') pool = pool.filter(i=>i.category===gearCat);

  el.innerHTML = `
<div class="filter-row">
  ${cats.map(c=>`<div class="pill${gearCat===c?' active':''}" onclick="setGearCat('${c}')">${c}</div>`).join('')}
</div>
${pool.length ? pool.map(itemCard).join('') : emptyState('⛺','No shared gear','Add Shared items in Notion.')}
<div style="height:8px"></div>`;
}

// ── Filter setters ────────────────────────────
function setPackPerson(p) { packPerson=p; renderPacking(); }
function setPackCat(c)    { packCat=c;    renderPacking(); }
function setGearCat(c)    { gearCat=c;    renderGear(); }
function setDay(d)        { activeDay=d;  renderMenu(); }

// ── Cycle status (tap dot) ────────────────────
async function cycleStatus(id) {
  const item = items.find(i=>i.id===id);
  if (!item) return;
  const idx  = CYCLE.indexOf(item.status);
  const next = CYCLE[idx<0?1:(idx+1)%CYCLE.length];
  item.status = next;
  renderAll();
  try { await patchItem(id,{'Status':{select:{name:next}}}); }
  catch(e) { console.error('Cycle failed',e); }
}

// ── Bottom sheet ──────────────────────────────
function openSheetById(id) {
  const item = items.find(i=>i.id===id);
  if (!item) return;
  editingId = id;

  document.getElementById('sheetTitle').textContent = item.name;
  document.getElementById('sheetStatus').value = item.status;

  const needsQty = item.qtyNeeded > 1;
  document.getElementById('sheetQtyWrap').style.display = needsQty ? 'block' : 'none';
  if (needsQty) {
    document.getElementById('sheetQtyVal').textContent = item.qtyPacked;
    document.getElementById('sheetQtyNeeded').textContent = 'of ' + item.qtyNeeded + ' needed';
  }

  const metaParts = [];
  if (item.assignedTo) metaParts.push('Assigned: ' + item.assignedTo);
  if (item.weight > 0) metaParts.push('Weight: ' + item.weight + 'g');
  if (item.day)        metaParts.push('Day: ' + item.day);
  if (item.meal)       metaParts.push('Meal: ' + item.meal);
  document.getElementById('sheetMeta').textContent = metaParts.join(' · ');
  document.getElementById('sheetMetaWrap').style.display = metaParts.length ? 'block' : 'none';

  document.getElementById('sheetNotes').textContent = item.notes;
  document.getElementById('sheetNotesWrap').style.display = item.notes ? 'block' : 'none';

  document.getElementById('editSheet').classList.add('open');
  refreshSheetPhoto();
}

function closeSheet() {
  document.getElementById('editSheet').classList.remove('open');
  editingId = null;
}

function adjustQty(delta) {
  const item = items.find(i=>i.id===editingId);
  const max  = item ? (item.qtyNeeded||1) : 99;
  const el   = document.getElementById('sheetQtyVal');
  el.textContent = Math.max(0, Math.min(max, parseInt(el.textContent)+delta));
}

async function saveSheet() {
  if (!editingId) return;
  const item = items.find(i=>i.id===editingId);
  if (!item) return;
  const status    = document.getElementById('sheetStatus').value;
  const qtyPacked = parseInt(document.getElementById('sheetQtyVal').textContent)||0;
  item.status    = status;
  item.qtyPacked = qtyPacked;
  closeSheet();
  renderAll();
  try {
    await patchItem(editingId, {
      'Status':     { select: { name: status } },
      'Qty Packed': { number: qtyPacked },
    });
  } catch(e) { console.error('Save failed',e); }
}

// ── Render all ────────────────────────────────
function renderAll() {
  renderOverview();
  if (currentTab==='packing') renderPacking();
  else if (currentTab==='menu')    renderMenu();
  else if (currentTab==='gear')    renderGear();
}

// ── Init ──────────────────────────────────────
loadData();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
document.getElementById('cameraInput').addEventListener('change', handlePhotoCapture);
</script>
</body>
